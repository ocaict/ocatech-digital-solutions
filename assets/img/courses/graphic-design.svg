<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08142b"/>
      <stop offset="100%" stop-color="#0f2247"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Clean unified dark navy surface -->
  <rect width="600" height="340" fill="url(#cardBg)"/>
  <rect width="600" height="340" fill="url(#centerGlow)"/>

  <!-- Subtle tech dot/grid matrix (brand unified) -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="85" x2="600" y2="85"/>
    <line x1="0" y1="170" x2="600" y2="170"/>
    <line x1="0" y1="255" x2="600" y2="255"/>
    <line x1="150" y1="0" x2="150" y2="340"/>
    <line x1="300" y1="0" x2="300" y2="340"/>
    <line x1="450" y1="0" x2="450" y2="340"/>
  </g>

  <!-- Central Visual Glyph with soft cyan glow (NO text inside image to avoid cut-off collisions) -->
  <g filter="drop-shadow(0 0 12px rgba(56, 189, 248, 0.45))">
    
    <circle cx="300" cy="150" r="55" fill="none" stroke="#38bdf8" stroke-width="6"/>
    <circle cx="275" cy="130" r="10" fill="#38bdf8"/>
    <circle cx="325" cy="130" r="10" fill="#38bdf8"/>
    <circle cx="300" cy="175" r="10" fill="#38bdf8"/>
    <path d="M335 180 C345 160 370 175 360 195 C350 208 325 195 335 180" fill="#38bdf8"/>
  
  </g>
</svg>