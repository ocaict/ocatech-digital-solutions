<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b172e"/>
      <stop offset="100%" stop-color="#132d5e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#46CEFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#46CEFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#46CEFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#46CEFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#46CEFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" fill="url(#bgGrad)"/>
  <rect width="600" height="340" fill="url(#glow)"/>

  <!-- Tech Grid Background Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="340"/>
    <line x1="200" y1="0" x2="200" y2="340"/>
    <line x1="300" y1="0" x2="300" y2="340"/>
    <line x1="400" y1="0" x2="400" y2="340"/>
    <line x1="500" y1="0" x2="500" y2="340"/>
  </g>

  <!-- Central Visual Glyph -->
  <g filter="drop-shadow(0 0 16px #46CEFF66)">
    
        <path d="M220 135 L260 115 L350 85 L350 215 L260 185 L220 165 Z" fill="none" stroke="#46CEFF" stroke-width="8" stroke-linejoin="round"/>
        <path d="M260 185 L260 225 L285 225 L285 177" fill="none" stroke="#46CEFF" stroke-width="6"/>
        <path d="M370 120 C385 130 385 170 370 180" fill="none" stroke="#46CEFF" stroke-width="6" stroke-linecap="round"/>
        <path d="M390 105 C415 125 415 175 390 195" fill="none" stroke="#46CEFF" stroke-width="6" stroke-linecap="round"/>
      
  </g>

  <!-- Subtitle Tag / Badge -->
  <rect x="60" y="278" width="480" height="1" fill="url(#lineGrad)"/>
  <text x="300" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="0.08em" text-anchor="middle" opacity="0.95">AI-ASSISTED DEVELOPMENT</text>
</svg>