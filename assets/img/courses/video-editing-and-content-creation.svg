<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#20061e"/>
      <stop offset="100%" stop-color="#3a0937"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FE00C9" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FE00C9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FE00C9" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FE00C9" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FE00C9" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" fill="url(#bgGrad)"/>
  <rect width="600" height="340" fill="url(#glow)"/>

  <!-- Tech Grid Background Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="340"/>
    <line x1="200" y1="0" x2="200" y2="340"/>
    <line x1="300" y1="0" x2="300" y2="340"/>
    <line x1="400" y1="0" x2="400" y2="340"/>
    <line x1="500" y1="0" x2="500" y2="340"/>
  </g>

  <!-- Central Visual Glyph -->
  <g filter="drop-shadow(0 0 16px #FE00C966)">
    
        <circle cx="300" cy="150" r="60" fill="none" stroke="#FE00C9" stroke-width="8"/>
        <circle cx="275" cy="130" r="12" fill="#FE00C9"/>
        <circle cx="325" cy="130" r="12" fill="#FE00C9"/>
        <circle cx="300" cy="175" r="12" fill="#FE00C9"/>
        <path d="M340 185 C350 160 380 180 370 200 C360 215 330 200 340 185" fill="#FE00C9"/>
      
  </g>

  <!-- Subtitle Tag / Badge -->
  <rect x="60" y="278" width="480" height="1" fill="url(#lineGrad)"/>
  <text x="300" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="0.08em" text-anchor="middle" opacity="0.95">VIDEO EDITING</text>
</svg>