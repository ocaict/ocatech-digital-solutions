<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091326"/>
      <stop offset="100%" stop-color="#152549"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#3D5C99" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3D5C99" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3D5C99" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3D5C99" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3D5C99" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" fill="url(#bgGrad)"/>
  <rect width="600" height="340" fill="url(#glow)"/>

  <!-- Tech Grid Background Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="340"/>
    <line x1="200" y1="0" x2="200" y2="340"/>
    <line x1="300" y1="0" x2="300" y2="340"/>
    <line x1="400" y1="0" x2="400" y2="340"/>
    <line x1="500" y1="0" x2="500" y2="340"/>
  </g>

  <!-- Central Visual Glyph -->
  <g filter="drop-shadow(0 0 16px #3D5C9966)">
    
        <rect x="220" y="160" width="30" height="60" rx="4" fill="#3D5C99" opacity="0.6"/>
        <rect x="265" y="120" width="30" height="100" rx="4" fill="#3D5C99" opacity="0.8"/>
        <rect x="310" y="80" width="30" height="140" rx="4" fill="#3D5C99"/>
        <rect x="355" y="140" width="30" height="80" rx="4" fill="#3D5C99" opacity="0.7"/>
        <path d="M210 225 L395 225" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
      
  </g>

  <!-- Subtitle Tag / Badge -->
  <rect x="60" y="278" width="480" height="1" fill="url(#lineGrad)"/>
  <text x="300" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="0.08em" text-anchor="middle" opacity="0.95">DATA ANALYSIS</text>
</svg>